.ph{width:380px;height:780px;border-radius:66px;padding:14px;position:absolute;left:0;top:0}
.ph .scr{position:absolute;inset:14px;border-radius:52px;overflow:hidden}
.ph .isl{position:absolute;left:50%;top:30px;width:110px;height:32px;margin-left:-55px;border-radius:16px;background:#05070B;z-index:5}
.ph.old{background:linear-gradient(145deg,#3A414D,#1E232B 60%,#2B313B);box-shadow:0 40px 80px rgba(0,0,0,.45),inset 0 0 0 2px #4A525F}
.ph.old .scr{background:linear-gradient(170deg,#1B2433,#0E1520)}
.ph.new{background:linear-gradient(145deg,#DCE9F7,#9FB8D3 45%,#E9F1FA 70%,#A9C0DA);box-shadow:0 50px 90px rgba(4,106,216,.35),inset 0 0 0 2px #fff}
.ph.new .scr{background:radial-gradient(420px 520px at 30% 20%,#8CC6FF 0%,#046AD8 55%,#0350A6 100%)}
.apps{position:absolute;left:34px;right:34px;top:110px;display:grid;grid-template-columns:repeat(4,1fr);gap:26px 22px}
.apps i{display:block;aspect-ratio:1;border-radius:18px;background:#3B4658}
.new .apps i{background:rgba(255,255,255,.28)}
.dim{position:absolute;inset:0;background:#05080D}
.spin{position:absolute;left:50%;top:470px;width:84px;height:84px;margin:-42px 0 0 -42px}
.crk{position:absolute;inset:0}
.glare{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 38%)}
.shadow{position:absolute;width:300px;height:44px;border-radius:50%;background:rgba(6,24,51,.28);filter:blur(16px)}
/* UI */
.bar{width:800px;height:100px;border-radius:30px;border:5px solid rgba(255,255,255,.85);position:absolute;padding:8px}
.seg{position:absolute;top:8px;bottom:8px;border-radius:20px}
.lbl{font-size:34px;font-weight:600;text-align:center;letter-spacing:-.01em}
.pill{border-radius:999px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:14px}
.card{background:#fff;border-radius:44px;box-shadow:0 30px 70px rgba(11,31,58,.16)}
.tile{width:150px;height:150px;border-radius:36px;background:#fff;border:5px solid var(--blue);box-shadow:0 20px 40px rgba(11,31,58,.14);display:grid;place-items:center}
.ico{width:130px;height:130px;border-radius:34px;background:#fff;box-shadow:0 18px 40px rgba(11,31,58,.18);display:grid;place-items:center}
.bub{position:absolute;border-radius:28px;box-shadow:0 6px 16px rgba(11,31,58,.10)}
#cover{position:absolute;inset:0;z-index:99;background:rgba(6,24,51,.85);display:none;place-items:center;color:#fff;font:700 56px Inter;cursor:pointer}
